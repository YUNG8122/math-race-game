<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8"><title>Админка</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="app-header"><div class="logo">⚙️ Админ-панель</div><a href="/" class="back-link">← На сайт</a></header>
    <main class="container" style="align-items:flex-start;">
        <div class="card" style="max-width: 900px;">
            <h2>Добавить вопрос (Игра 1)</h2>
            <form action="/admin" method="GET" style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:30px;">
                <input type="hidden" name="add" value="1">
                <input type="text" name="shape" placeholder="Фигура (Квадрат)" required>
                <input type="text" name="correct" placeholder="Правильный ответ" required>
                <input type="text" name="wrong1" placeholder="Неверный 1" required>
                <input type="text" name="wrong2" placeholder="Неверный 2" required>
                <input type="text" name="wrong3" placeholder="Неверный 3" required>
                <input type="text" name="explanation" placeholder="Объяснение ошибки">
                <button type="submit" class="btn-primary" style="grid-column: span 2;">Добавить</button>
            </form>
            <h3>Текущие вопросы ({{ questions|length }})</h3>
            <table style="width:100%; border-collapse:collapse; margin-top:10px;">
                <tr style="background:var(--bg);"><th>Фигура</th><th>Ответ</th><th>Объяснение</th></tr>
                {% for q in questions %}
                <tr style="border-bottom:1px solid var(--border);"><td>{{ q.shape }}</td><td>{{ q.correct }}</td><td>{{ q.explanation }}</td></tr>
                {% endfor %}
            </table>
        </div>
    </main>
</body>
</html>
